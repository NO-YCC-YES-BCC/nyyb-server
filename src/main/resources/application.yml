spring:
  application:
    name: nyyb-server        # 앱 이름

  profiles:
    active: local            # 기본 프로파일

  jpa:
    hibernate:
      ddl-auto: validate     # 스키마 검증만 (운영)
    properties:
      hibernate:
        format_sql: true     # SQL 포맷 정렬
    open-in-view: false      # OSIV 비활성화

  servlet:
    multipart:
      max-file-size: 10MB    # 업로드 이미지 최대 크기
      max-request-size: 10MB

# CLOVA OCR 값(api-url, secret-key)은 프로파일별 파일에서 주입

# AWS S3 값(bucket, static, access-key, secret-key)은 프로파일별 파일에서 주입

# 데이터소스는 프로파일별 파일 또는 환경변수로 주입