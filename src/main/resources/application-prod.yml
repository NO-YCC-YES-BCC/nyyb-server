# 운영 설정 — 비밀값은 전부 환경변수로 주입 (이 파일은 커밋됨, 값 직접 기입 금지)
spring:
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate     # 운영은 스키마 검증만 (변경은 마이그레이션으로)
    show-sql: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5.4-mini}
          temperature: ${OPENAI_CHAT_TEMPERATURE:0.3}

# 프론트를 같은 오리진에서 서빙하므로 기본값은 sott.site 만 허용
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://sott.site}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
  refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:1209600}

kakao:
  client-id: ${KAKAO_CLIENT_ID:dummy-client-id}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:https://sott.site/auth/kakao}

clova-ocr:
  api-url: ${CLOVA_OCR_API_URL}
  secret-key: ${CLOVA_OCR_SECRET_KEY}

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
