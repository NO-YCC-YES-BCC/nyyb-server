# api.hwangs.site — HTTPS 리버스 프록시 (443 → nyyb-be:8080)
#
# nyyb-be(본 서비스)는 별도 compose 프로젝트라 외부 네트워크 'web' 을 통해 접근한다.
# nginx 는 이 스택에만 있으므로, 본 서비스의 프록시 설정도 여기서 함께 관리한다.
# 인증서는 certbot_conf 볼륨에 sott.site 와 함께 보관.

server {
    listen 80;
    server_name api.hwangs.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.hwangs.site$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.hwangs.site;

    ssl_certificate     /etc/letsencrypt/live/api.hwangs.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hwangs.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 전성분 원본 이미지 업로드 (서버 제한 10MB)
    client_max_body_size 12m;

    # OCR + LLM 호출이 길어질 수 있어 기본 60초보다 늘린다
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location / {
        proxy_pass http://nyyb-be:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
