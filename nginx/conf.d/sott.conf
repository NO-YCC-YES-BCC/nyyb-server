# sott.site — HTTPS 리버스 프록시 (443 → sott-be:8080)
# 페이지와 API가 같은 오리진이라 CORS 없이 동작한다.
# 인증서는 certbot이 발급해 certbot_conf 볼륨에 저장, 갱신은 webroot(certbot_www) 방식.

server {
    listen 80;
    server_name sott.site www.sott.site;

    # Let's Encrypt 발급·갱신 챌린지
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sott.site$request_uri;
    }
}

# www → 루트 도메인으로 통일
server {
    listen 443 ssl;
    server_name www.sott.site;

    ssl_certificate     /etc/letsencrypt/live/sott.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sott.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://sott.site$request_uri;
}

server {
    listen 443 ssl;
    server_name sott.site;

    ssl_certificate     /etc/letsencrypt/live/sott.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sott.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 원본 사진 업로드가 있어 여유를 둔다 (앱은 리사이즈 후 전송, 서버 제한은 10MB)
    client_max_body_size 12m;

    # OCR + LLM 호출이 길어질 수 있어 기본 60초보다 늘린다
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location / {
        proxy_pass http://sott-be:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
