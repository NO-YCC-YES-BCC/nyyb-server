# nyyb-server 배포 스택 (OCI VM) — 애플리케이션 + MariaDB
#
# 리버스 프록시(nginx)는 같은 VM의 별도 스택이 80/443을 이미 점유하고 있어
# 여기서 띄우지 않는다. 대신 외부 네트워크 'web'에 참여해 nginx가 찾아올 수 있게 한다.
#
# 최초 1회:
#   docker network create web
#   cp .env.example .env   (값 기입)
services:
  nyyb-mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nyyb_db_data:/var/lib/mysql
    # 외부 포트는 열지 않는다. 접근은 compose 네트워크 안에서만.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  nyyb-be:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      nyyb-mariadb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL}
      OPENAI_CHAT_TEMPERATURE: ${OPENAI_CHAT_TEMPERATURE}

      CLOVA_OCR_API_URL: ${CLOVA_OCR_API_URL}
      CLOVA_OCR_SECRET_KEY: ${CLOVA_OCR_SECRET_KEY}

      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_VALIDITY_SECONDS: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS}
      JWT_REFRESH_TOKEN_VALIDITY_SECONDS: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS}

      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    networks:
      - default   # nyyb-mariadb 접근용
      - web       # nginx가 찾아오는 경로

volumes:
  nyyb_db_data:

networks:
  web:
    external: true
