# SOTT 배포 스택 (OCI VM) — MySQL + nyyb-server + nginx
# DB를 VM 안에서 직접 띄운다(외부 무료 티어 만료 이슈 회피). 데이터는 mysql_data 볼륨에 영속.
# 비밀값은 이 파일 옆의 .env에서 주입 (.env.example 참고)
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # 외부 포트를 열지 않는다. 접근은 compose 네트워크 안에서만.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  sott-be:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL}
      OPENAI_CHAT_TEMPERATURE: ${OPENAI_CHAT_TEMPERATURE}

      CLOVA_OCR_API_URL: ${CLOVA_OCR_API_URL}
      CLOVA_OCR_SECRET_KEY: ${CLOVA_OCR_SECRET_KEY}

      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      # 프론트를 같은 오리진에서 서빙하므로 실제로는 거의 쓰이지 않는다
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - sott-be
    networks:
      - default   # sott-be 접근용
      - web       # 본 서비스(nyyb-be) 접근용

volumes:
  mysql_data:
  # 최초 1회 생성 필요:
  #   docker volume create sott_certbot_conf
  #   docker volume create sott_certbot_www
  certbot_conf:
    external: true
    name: sott_certbot_conf
  certbot_www:
    external: true
    name: sott_certbot_www

networks:
  web:
    external: true
